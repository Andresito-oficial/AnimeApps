name: Publicar en Pling

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      manual_version:
        description: 'Versión (ej. v1.0.1) - Dejar en blanco si usas el último Release'
        required: false
        default: ''

jobs:
  update-pling:
    runs-on: windows-2022
    steps:
      - name: Obtener información del release y changelog en Windows
        id: get_release
        shell: pwsh
        run: |
          inputVersion = "{{ github.event.inputs.manual_version }}"
          
          if (\$inputVersion -ne "") {
            version = inputVersion
            releaseUrl = "{{ github.server_url }}/ github.repository /releases/tag/inputVersion"
            \$changelog = "Actualización manual desde GitHub Actions en Windows Server para la versión \$inputVersion."
          } else {
            version = "{{ github.event.release.tag_name }}"
            releaseUrl = "{{ github.event.release.html_url }}"
            \$changelog = @"
          \${{ github.event.release.body }}
          "@
          }
          
          # Guardamos las variables en el entorno global de GitHub Actions
          Add-Content -Path \(env:GITHUB_ENV -Value "VERSION=\)version"
          Add-Content -Path \(env:GITHUB_ENV -Value "RELEASE_URL=\)releaseUrl"
          
          # Convertimos los saltos de línea de Windows e independientes a formato HTML <br> para Pling
          changelogHtml = changelog -replace "`r`n", "<br>" -replace "`n", "<br>"
          Add-Content -Path \(env:GITHUB_ENV -Value "CHANGELOG=\)changelogHtml"

      - name: Actualizar registro y Changelog en Pling vía API OCS
        shell: pwsh
        env:
          USER_SECRET: \${{ secrets.PLING_USER }}
          PASS_SECRET: \${{ secrets.PLING_PASSWORD }}
          PROD_ID: \${{ vars.PRODUCT_ID }}
        run: |
          # Formateamos la descripción final uniendo las variables del paso anterior
          \$descripcionFinal = "Icon pack updated to version (env:VERSION).<br><br><strong>Changelog:</strong><br>(env:CHANGELOG)<br><br>🔗 Download directly from GitHub: (env:RELEASE_URL)"
          
          # Construimos la cabecera HTTP Basic Auth cifrando el par usuario:contraseña en Base64
          # Esto evita por completo que el signo '\$' de tu contraseña rompa el script
          \$pair = "(env:USER_SECRET):(env:PASS_SECRET)"
          \(bytes = [System.Text.Encoding]::ASCII.GetBytes(\)pair)
          \(base64 = [System.Convert]::ToBase64String(\)bytes)
          basicAuth = "Basic base64"
          
          \$headers = @{
            "Authorization" = \$basicAuth
          }
          
          # Preparamos el cuerpo de datos exacto que exige el protocolo OCS de Pling
          \$body = @{
            "version"          = \$env:VERSION
            "description"      = \$descripcionFinal
            "downloadlinkover" = "1"
            "downloadlink1"    = \$env:RELEASE_URL
          }
          
          # URL definitiva de la API apuntando al endpoint de edición del producto
          \$url = "https://opendesktop.org"
          
          # Lanzamos la petición REST nativa de Windows Server
          Invoke-RestMethod -Uri \$url -Method Post -Headers headers -Body body
