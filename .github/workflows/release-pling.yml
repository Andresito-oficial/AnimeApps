name: Publicar en Pling

on:
  release:
    types: [published]

jobs:
  update-pling:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener información del release y changelog
        id: get_release
        run: |
          # Guardamos la versión y la URL del release en el entorno
          VERSION="${{ github.event.release.tag_name }}"
          RELEASE_URL="${{ github.event.release.html_url }}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "RELEASE_URL=$RELEASE_URL" >> $GITHUB_ENV
          
          # Capturamos el texto del Changelog del Release de GitHub
          # Usamos un delimitador para guardar textos multilínea de forma segura
          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          echo "${{ github.event.release.body }}" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Actualizar registro y Changelog en Pling vía API OCS
        run: |
          # Formateamos el texto final sumando un enlace directo y las notas de cambios
          DESCRIPCION_FINAL="Icon pack updated to version ${{ env.VERSION }}.<br><br><strong>Changelog:</strong><br>${{ env.CHANGELOG }}<br><br>🔗 Download directly from GitHub: ${{ env.RELEASE_URL }}"
          
          # Petición HTTP para actualizar versión, descripción y enlace de descarga externa
          curl --request POST \
            --url "https://${{ secrets.PLING_USER }}:${{ secrets.PLING_PASSWORD }}@api.opendesktop.org/ocs/v1/content/edit/${{ vars.PRODUCT_ID }}" \
            --data "version=${{ env.VERSION }}" \
            --data "description=$DESCRIPCION_FINAL" \
            --data "downloadlinkover=1" \
            --data "downloadlink1=${{ env.RELEASE_URL }}"
