name: Publicar en Pling

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      manual_version:
        description: 'Versión (ej. v1.0.1) - Dejar en blanco si usas el último Release'
        required: false
        default: ''

jobs:
  update-pling:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener información del release y changelog
        id: get_release
        run: |
          INPUT_VERSION="${{ github.event.inputs.manual_version }}"
          
          if [ -n "$INPUT_VERSION" ]; then
            echo "VERSION=$INPUT_VERSION" >> $GITHUB_ENV
            echo "RELEASE_URL=${{ github.server_url }}/${{ github.repository }}/releases/tag/$INPUT_VERSION" >> $GITHUB_ENV
            echo "CHANGELOG=Actualización manual desde GitHub Actions para la versión $INPUT_VERSION." >> $GITHUB_ENV
          else
            echo "VERSION=${{ github.event.release.tag_name }}" >> $GITHUB_ENV
            echo "RELEASE_URL=${{ github.event.release.html_url }}" >> $GITHUB_ENV
            
            echo "CHANGELOG<<EOF" >> $GITHUB_ENV
            echo "${{ github.event.release.body }}" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          fi

      - name: Actualizar registro y Changelog en Pling vía API OCS
        env:
          USER_SECRET: ${{ secrets.PLING_USER }}
          PASS_SECRET: ${{ secrets.PLING_PASSWORD }}
          PROD_ID: ${{ vars.PRODUCT_ID }}
        run: |
          # Convertimos los saltos de línea del changelog a formato HTML <br>
          TEXTO_CAMBIOS=$(echo "${{ env.CHANGELOG }}" | sed ':a;N;$!ba;s/\n/<br>/g')
          
          DESCRIPCION_FINAL="Icon pack updated to version ${{ env.VERSION }}.<br><br><strong>Changelog:</strong><br>${TEXTO_CAMBIOS}<br><br>🔗 Download directly from GitHub: ${{ env.RELEASE_URL }}"
          
          # Extraemos también el ID de producto como variable de entorno para limpiar la URL de llaves
          curl --request POST \
            --url "https://opendesktop.org" \
            --user "$USER_SECRET:$PASS_SECRET" \
            --data-urlencode "version=${{ env.VERSION }}" \
            --data-urlencode "description=${DESCRIPCION_FINAL}" \
            --data-urlencode "downloadlinkover=1" \
            --data-urlencode "downloadlink1=${{ env.RELEASE_URL }}"
