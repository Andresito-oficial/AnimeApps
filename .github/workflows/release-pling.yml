name: Publicar en Pling

on:
  release:
    types: [published]
  workflow_dispatch: # Permite la ejecución manual desde la web de GitHub
    inputs:
      manual_version:
        description: 'Versión (ej. v1.0.1) - Dejar en blanco si usas el último Release'
        required: false
        default: ''

jobs:
  update-pling:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener información del release y changelog
        id: get_release
        run: |
          # Si se ejecuta manualmente y se introduce una versión, la usamos.
          # Si no, buscamos los datos del evento del Release de GitHub.
          INPUT_VERSION="${{ github.event.inputs.manual_version }}"
          
          if [ -n "$INPUT_VERSION" ]; then
            echo "VERSION=$INPUT_VERSION" >> $GITHUB_ENV
            echo "RELEASE_URL=${{ github.server_url }}/${{ github.repository }}/releases/tag/$INPUT_VERSION" >> $GITHUB_ENV
            echo "CHANGELOG=Actualización manual de versión $INPUT_VERSION." >> $GITHUB_ENV
          else
            echo "VERSION=${{ github.event.release.tag_name }}" >> $GITHUB_ENV
            echo "RELEASE_URL=${{ github.event.release.html_url }}" >> $GITHUB_ENV
            
            echo "CHANGELOG<<EOF" >> $GITHUB_ENV
            echo "${{ github.event.release.body }}" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          fi

      - name: Actualizar registro y Changelog en Pling vía API OCS
        run: |
          DESCRIPCION_FINAL="Icon pack updated to version ${{ env.VERSION }}.<br><br><strong>Changelog:</strong><br>${{ env.CHANGELOG }}<br><br>🔗 Download directly from GitHub: ${{ env.RELEASE_URL }}"
          
          curl --request POST \
            --url "https://${{ secrets.PLING_USER }}:${{ secrets.PLING_PASSWORD }}@api.opendesktop.org/ocs/v1/content/edit/${{ vars.PRODUCT_ID }}" \
            --data "version=${{ env.VERSION }}" \
            --data "description=$DESCRIPCION_FINAL" \
            --data "downloadlinkover=1" \
            --data "downloadlink1=${{ env.RELEASE_URL }}"
