name: Publicar en Pling

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      manual_version:
        description: 'Version (ej. v1.0.1) - Dejar en blanco si usas el ultimo Release'
        required: false
        default: ''

jobs:
  update-pling:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest # Todo el proceso bajo Arch Linux puro
    steps:
      - name: Instalar Python y dependencias en Arch
        run: |
          pacman -Sy --noconfirm python-pip curl

      - name: Instalar pling-publisher via PIP
        run: |
          # Instalamos la herramienta oficial de despliegue para Pling
          pip install --break-system-packages pling-publisher

      - name: Obtener informacion del release
        id: get_release
        run: |
          INPUT_VERSION="${{ github.event.inputs.manual_version }}"
          
          if [ -n "$INPUT_VERSION" ]; then
            echo "VERSION=$INPUT_VERSION" >> $GITHUB_ENV
            echo "RELEASE_URL=${{ github.server_url }}/${{ github.repository }}/releases/tag/$INPUT_VERSION" >> $GITHUB_ENV
          else
            echo "VERSION=${{ github.event.release.tag_name }}" >> $GITHUB_ENV
            echo "RELEASE_URL=${{ github.event.release.html_url }}" >> $GITHUB_ENV
          fi

      - name: Publicar de verdad en Pling usando la herramienta oficial
        env:
          USER_SECRET: ${{ secrets.PLING_USER }}
          PASS_SECRET: ${{ secrets.PLING_PASSWORD }}
          PROD_ID: ${{ vars.PRODUCT_ID }}
        run: |
          # pling-publisher simula el inicio de sesion del navegador y salta el bloqueo de la API.
          # Le inyectamos tu ID de producto, la nueva version y la URL del release de GitHub.
          pling-publisher \
            --user "$USER_SECRET" \
            --password "$PASS_SECRET" \
            --product "$PROD_ID" \
            --version "${{ env.VERSION }}" \
            --description "Icon pack updated to version ${{ env.VERSION }}. Download the latest assets directly from GitHub: ${{ env.RELEASE_URL }}"
