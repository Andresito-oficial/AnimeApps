name: Publicar en Pling

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      manual_version:
        description: 'Version (ej. v1.0.1) - Dejar en blanco si usas el ultimo Release'
        required: false
        default: ''

jobs:
  update-pling:
    runs-on: windows-2022
    steps:
      - name: Obtener informacion del release y changelog en Windows
        shell: cmd
        run: |
          SET "INPUT_VERSION=${{ github.event.inputs.manual_version }}"
          
          IF NOT "%INPUT_VERSION%"=="" (
            SET "VERSION=%INPUT_VERSION%"
            SET "RELEASE_URL=${{ github.server_url }}/${{ github.repository }}/releases/tag/%INPUT_VERSION%"
            SET "CHANGELOG=Actualizacion manual desde GitHub Actions en Windows Server."
          ) ELSE (
            SET "VERSION=${{ github.event.release.tag_name }}"
            SET "RELEASE_URL=${{ github.event.release.html_url }}"
            SET "CHANGELOG=Nueva version publicada en GitHub."
          )
          
          REM Guardamos las variables de forma limpia en el entorno de GitHub
          echo VERSION=%VERSION%>>%GITHUB_ENV%
          echo RELEASE_URL=%RELEASE_URL%>>%GITHUB_ENV%
          echo CHANGELOG=%CHANGELOG%>>%GITHUB_ENV%

      - name: Actualizar registro en Pling via curl nativo de Windows Server
        shell: cmd
        env:
          USER_SECRET: ${{ secrets.PLING_USER }}
          PASS_SECRET: ${{ secrets.PLING_PASSWORD }}
          PROD_ID: ${{ vars.PRODUCT_ID }}
        run: |
          REM Formateamos el bloque de texto final usando variables clasicas de CMD
          SET "DESCRIPCION_FINAL=Icon pack updated to version %VERSION%.<br><br><strong>Changelog:</strong><br>%CHANGELOG%<br><br>🔗 Download directly from GitHub: %RELEASE_URL%"
          
          REM Ejecutamos curl directamente usando la cabecera --user. 
          REM CMD no interpreta el signo '$' de tu contraseña, por lo que le llegara a Pling perfecta.
          curl --request POST ^
            --url "https://opendesktop.org%" ^
            --user "%USER_SECRET%:%PASS_SECRET%" ^
            --data-urlencode "version=%VERSION%" ^
            --data-urlencode "description=%DESCRIPCION_FINAL%" ^
            --data-urlencode "downloadlinkover=1" ^
            --data-urlencode "downloadlink1=%RELEASE_URL%"
